<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Diwali</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yatra+One&family=Mukta:wght@400;600&display=swap">
<style>
:root{--night:#12082b;--plum:#2a0f4a;--marigold:#ffb627;--flame:#ff7a1a;--rose:#ff4d8d;--cream:#fff3d6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0}
body{background:radial-gradient(ellipse at 50% 110%,var(--plum),var(--night) 65%);color:var(--cream);
font-family:'Mukta',system-ui,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
main{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.5rem;
text-align:center;padding:76px 20px 72px;pointer-events:none}
h1{font-family:'Yatra One',Georgia,serif;font-weight:400;font-size:clamp(2.4rem,9vw,5rem);line-height:1;margin:0;
color:var(--marigold);text-shadow:0 0 30px rgba(255,150,30,.55),0 0 80px rgba(255,77,141,.35);letter-spacing:.02em}
h1 span{display:inline-block;opacity:0;transform:translateY(40px) scale(.6);filter:blur(10px);
animation:pop 1s cubic-bezier(.2,.9,.25,1.2) forwards;animation-delay:calc(var(--i)*70ms + 300ms)}
@keyframes pop{to{opacity:1;transform:none;filter:none}}
.to{font-size:clamp(1.3rem,4.5vw,2.2rem);margin:.9rem 0 .4rem;min-height:1.4em;color:var(--cream);font-weight:600}
.msg{max-width:34ch;font-size:clamp(1rem,3vw,1.25rem);line-height:1.55;opacity:.85;margin:0}
.diya{position:relative;width:84px;height:44px;margin-top:2.2rem}
.diya .bowl{position:absolute;bottom:0;left:0;right:0;height:26px;border-radius:0 0 50px 50px / 0 0 36px 36px;
background:linear-gradient(#e0792a,#8d3a10);box-shadow:0 0 40px 8px rgba(255,140,30,.45)}
.diya .flame{position:absolute;left:50%;bottom:22px;width:20px;height:38px;margin-left:-10px;border-radius:50% 50% 50% 50% / 62% 62% 38% 38%;
background:radial-gradient(ellipse at 50% 75%,#fff7c2 8%,var(--marigold) 45%,var(--flame) 80%);
transform-origin:50% 100%;animation:flick 1.3s ease-in-out infinite alternate;filter:blur(.4px);box-shadow:0 0 28px 10px rgba(255,160,40,.7)}
@keyframes flick{0%{transform:scale(1,1) rotate(-3deg)}35%{transform:scale(.92,1.08) rotate(2deg)}70%{transform:scale(1.06,.96) rotate(-2deg)}100%{transform:scale(.95,1.05) rotate(3deg)}}
.ui{position:fixed;z-index:3;right:max(14px,env(safe-area-inset-right,0px));bottom:max(14px,env(safe-area-inset-bottom,0px));display:flex;gap:10px;justify-content:flex-end}
input,button{font:inherit;font-size:1rem;border-radius:999px;border:1.5px solid rgba(255,182,39,.6);padding:.7rem 1.2rem;color:var(--cream);background:rgba(18,8,43,.65);backdrop-filter:blur(6px)}
input{width:min(240px,60vw);outline:none;text-align:center}
input::placeholder{color:rgba(255,243,214,.5)}
input:focus-visible,button:focus-visible{outline:3px solid var(--rose);outline-offset:2px}
button{cursor:pointer;background:linear-gradient(135deg,var(--flame),var(--rose));border-color:transparent;font-weight:600;transition:transform .15s}
button:hover{transform:scale(1.05)}button:active{transform:scale(.96)}
.hint{position:fixed;z-index:3;top:max(12px,env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;align-items:flex-start;gap:6px;font-size:.85rem;pointer-events:none}
.hint span{opacity:.6;padding-left:6px}
.hint button{pointer-events:auto;display:inline-flex;align-items:center;gap:.5rem;padding:.5rem 1rem;font-size:.95rem}
.hint button svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@media (prefers-reduced-motion:reduce){h1 span{animation-duration:.01s;animation-delay:0s}.diya .flame{animation:none}}
.start{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;overflow-y:auto;gap:14px;text-align:center;padding:24px;background:radial-gradient(ellipse at 50% 110%,var(--plum),var(--night) 65%);transition:opacity .7s}
.start.off{opacity:0;pointer-events:none}
.start h2{font-family:'Yatra One',Georgia,serif;font-weight:400;font-size:clamp(2rem,8vw,3.6rem);margin:0;color:var(--marigold);text-shadow:0 0 30px rgba(255,150,30,.5)}
.start p{margin:0;opacity:.75;max-width:30ch}
.cats{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:560px}
.cats button{padding:.45rem .95rem;font-size:.9rem;color:var(--cream);background:rgba(18,8,43,.65);border:1.5px solid rgba(255,182,39,.45)}
.cats button[aria-checked="true"]{background:linear-gradient(135deg,var(--flame),var(--rose));border-color:transparent;font-weight:600}
.start form{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.hide{display:none!important}
.head{position:relative;width:100%}
#banner{position:absolute;left:0;right:0;bottom:100%;margin-bottom:.45rem;text-align:center;font-family:'Yatra One',Georgia,serif;font-size:clamp(1.3rem,5.5vw,2.4rem);line-height:1.2;color:var(--cream);text-shadow:0 0 24px var(--flame),0 0 50px var(--rose);opacity:0;transform:scale(.85);transform-origin:50% 100%;transition:opacity 1s,transform 1.4s cubic-bezier(.2,.9,.25,1);pointer-events:none}
#banner.on{opacity:1;transform:scale(1)}
#toast{position:fixed;z-index:6;left:50%;top:max(48px,env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--cream);color:var(--night);padding:.5rem 1.1rem;border-radius:999px;font-weight:600;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90vw}
#toast.on{opacity:1}
button.alt{background:rgba(18,8,43,.65);border:1.5px solid rgba(255,182,39,.6)}
button:disabled{opacity:.55;cursor:default;transform:none}
.rangoli{position:fixed;z-index:1;left:50%;top:46%;width:min(86vw,44vh,520px);aspect-ratio:1;transform:translate(-50%,-50%);pointer-events:none;opacity:1;transition:filter 1s,opacity .9s}
.rangoli svg{width:100%;height:100%;overflow:visible;animation:rIn 2.2s cubic-bezier(.2,.8,.2,1) both}
@keyframes rIn{from{opacity:0;transform:scale(.88) rotate(-12deg)}to{opacity:1;transform:none}}
.rangoli path,.rangoli .ring{fill:var(--f,none);fill-opacity:0;stroke:var(--s);stroke-width:2.2;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation-name:draw,fillin;animation-duration:1.9s,1.5s;animation-delay:var(--d),calc(var(--d) + .9s);animation-fill-mode:forwards,forwards;animation-timing-function:ease-in-out,ease}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fillin{to{fill-opacity:.85}}
.rangoli .dot{fill:var(--f);transform-box:fill-box;transform-origin:center;transform:scale(0);animation:popin .5s cubic-bezier(.3,1.6,.5,1) forwards var(--d)}
@keyframes popin{to{transform:scale(1)}}
.rangoli .lamp{fill:#ffa21a;opacity:0;transform-box:fill-box;transform-origin:center;animation:lampon .6s ease forwards var(--d),flick 1.1s ease-in-out infinite alternate calc(var(--d) + .6s);filter:drop-shadow(0 0 6px #ffb627)}
@keyframes lampon{to{opacity:1}}
@keyframes flick{from{transform:scale(.85)}to{transform:scale(1.2)}}
body.fin .rangoli{filter:drop-shadow(0 0 16px rgba(255,170,60,.8)) brightness(1.25)}
.to,.msg{text-shadow:0 2px 14px rgba(18,8,43,.95),0 0 4px rgba(18,8,43,.9)}
h1{text-shadow:0 0 30px rgba(255,150,30,.55),0 2px 4px rgba(18,8,43,.95),0 4px 22px rgba(18,8,43,.95)}
@media (prefers-reduced-motion:reduce){.rangoli *{animation-duration:.01s!important;animation-delay:0s!important}}
#c2{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
.stage{position:relative;width:min(86vw,44vh,520px);aspect-ratio:1;flex:none;margin:.3rem 0}
.stage .diya{position:absolute;left:50%;top:50%;margin:0;transform:translate(-50%,-50%) scale(.8)}
.ui button{width:46px;height:46px;padding:0;display:grid;place-items:center;position:relative}
.ui button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ui button::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 10px);right:0;white-space:nowrap;background:var(--cream);color:var(--night);font-size:.8rem;font-weight:600;padding:.3rem .75rem;border-radius:999px;opacity:0;transform:translateY(4px);pointer-events:none;transition:opacity .15s,transform .15s}
.ui button:hover::after,.ui button:focus-visible::after{opacity:1;transform:none}
h1,.to,.msg{transition:opacity .9s}
body.fin h1,body.fin .to,body.fin .msg{opacity:.05}
.rangoli.dim{opacity:.35}
/* ---- opening letter ---- */
.letter{position:fixed;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.6rem;cursor:pointer;transition:opacity .5s;-webkit-tap-highlight-color:transparent}
.letter:not(.in){opacity:0}
.letter.zoom{opacity:0;pointer-events:none;transition:opacity 1s ease .45s}
.zoomer{transition:transform 1.3s cubic-bezier(.55,0,.25,1)}
.letter.zoom .zoomer{transform:scale(2.8) translateY(-6%)}
.float{animation:bob 3.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-9px)}}
.env{position:relative;width:min(78vw,420px);aspect-ratio:3/2;perspective:1100px;opacity:0;outline:none}
.letter.in .env{animation:envIn 1.1s cubic-bezier(.2,.9,.3,1.15) forwards}
@keyframes envIn{from{opacity:0;transform:translateY(60px) scale(.86) rotate(-3deg)}to{opacity:1;transform:none}}
.env-back{position:absolute;inset:0;background:linear-gradient(#7a0f26,#5d0b1d);border-radius:6px;box-shadow:0 18px 50px rgba(0,0,0,.5),0 0 70px rgba(255,170,60,.28)}
.paper{position:absolute;left:5%;right:5%;top:6%;height:86%;z-index:2;background:#fff3d6;border-radius:4px;display:grid;place-items:center;text-align:center;color:#4a1228;box-shadow:0 2px 8px rgba(0,0,0,.25);transition:transform .95s cubic-bezier(.3,.8,.3,1) .5s}
.letter.open .paper{transform:translateY(-62%)}
.paper-in{border:2px double #c9961a;width:88%;height:82%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.3rem;padding:4px}
.p-om{font-family:'Yatra One',Georgia,serif;font-size:clamp(1.4rem,6vw,2.2rem);color:#c2253d;line-height:1}
.paper-in b{font-family:'Yatra One',Georgia,serif;font-weight:400;font-size:clamp(1.1rem,5vw,1.8rem)}
.paper-in i{font-size:clamp(.75rem,3vw,1rem);opacity:.75;font-style:normal}
.env-front{position:absolute;inset:0;z-index:3;background:linear-gradient(160deg,#c2253d,#8f1530);clip-path:polygon(0 0,50% 52%,100% 0,100% 100%,0 100%);border-radius:6px}
.flap{position:absolute;left:0;right:0;top:0;height:58%;z-index:4;background:linear-gradient(#d63a50,#a3182f);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:50% 0;transition:transform .8s cubic-bezier(.45,0,.2,1),z-index 0s .35s}
.letter.open .flap{transform:rotateX(180deg);z-index:1}
.seal{position:absolute;left:50%;top:56%;width:16%;aspect-ratio:1;transform:translate(-50%,-50%);z-index:5;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#ffe27a,#d9a22b 60%,#8a5a12);color:#8f1530;font-family:'Yatra One',Georgia,serif;font-size:clamp(1.1rem,5vw,1.8rem);box-shadow:0 3px 10px rgba(0,0,0,.45);animation:seal 2s ease-in-out infinite}
@keyframes seal{50%{box-shadow:0 3px 10px rgba(0,0,0,.45),0 0 22px rgba(255,200,80,.85)}}
.letter.open .seal{opacity:0;transform:translate(-50%,-50%) scale(.4) rotate(40deg);transition:.35s;animation:none}
.env-to{position:absolute;left:0;right:0;bottom:9%;z-index:4;text-align:center;font-family:'Yatra One',Georgia,serif;font-size:clamp(1rem,4.4vw,1.6rem);color:#fff3d6;text-shadow:0 2px 6px rgba(0,0,0,.5);padding:0 8%}
.tap{margin:0;letter-spacing:.08em;opacity:.85;animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.letter.open .tap{opacity:0;animation:none;transition:opacity .3s}
@media (prefers-reduced-motion:reduce){.float,.tap,.seal{animation:none}}
.start>:first-child{margin-top:auto}
.start>:last-child{margin-bottom:auto}
.cats button.edited::after{content:" \2022";color:var(--marigold)}
.wbox{width:min(520px,92vw)}
.wbox textarea{width:100%;box-sizing:border-box;font:inherit;font-size:.95rem;line-height:1.45;color:var(--cream);background:rgba(18,8,43,.65);border:1.5px solid rgba(255,182,39,.6);border-radius:16px;padding:.7rem 1rem;resize:vertical;min-height:96px;text-align:left;outline:none}
.wbox textarea:focus-visible{outline:3px solid var(--rose);outline-offset:2px}
.wtools{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:.8rem;opacity:.8}
.wtools button{padding:.3rem .85rem;font-size:.8rem;background:transparent;color:var(--cream);border:1.5px solid rgba(255,182,39,.45)}
.msg{white-space:pre-line}
.snd{position:fixed;z-index:7;top:max(12px,env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));width:42px;height:42px;padding:0;display:grid;place-items:center}
.snd svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.snd .soff,.snd.off .son{display:none}
.snd.off .soff{display:block}
.snd::after{content:attr(data-tip);position:absolute;top:calc(100% + 10px);right:0;white-space:nowrap;background:var(--cream);color:var(--night);font-size:.8rem;font-weight:600;padding:.3rem .75rem;border-radius:999px;opacity:0;transform:translateY(-4px);pointer-events:none;transition:opacity .15s,transform .15s}
.snd:hover::after,.snd:focus-visible::after{opacity:1;transform:none}

/* ---- thali: find the letter among the sweets ---- */
.thali{position:fixed;inset:0;z-index:3;display:flex;align-items:center;justify-content:center;padding:46px 0 0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
.thali.gone{pointer-events:none}
.find{position:absolute;left:0;right:0;top:calc(10px + env(safe-area-inset-top,0px));margin:0;padding:0 58px;text-align:center;font-family:'Yatra One',Georgia,serif;font-size:clamp(1.05rem,4.2vw,1.55rem);line-height:1.25;color:var(--marigold);text-shadow:0 0 18px rgba(255,150,30,.6),0 2px 6px rgba(18,8,43,.95);pointer-events:none;opacity:0;animation:fin .8s ease .9s forwards}
@keyframes fin{to{opacity:1}}
.thali.gone .find{opacity:0;animation:none;transition:opacity .3s}
.pwrap{width:min(94vw,calc(100vh - 118px),600px);aspect-ratio:1;transition:opacity .9s ease .3s,transform 1.1s ease .3s,filter .9s ease .3s}
.thali.gone .pwrap{opacity:0;transform:scale(.9);filter:blur(5px)}
.pin{position:relative;width:100%;height:100%;animation:pIn 1.9s cubic-bezier(.2,.8,.2,1) both}
@keyframes pIn{from{opacity:0;transform:scale(.4) rotate(-320deg)}to{opacity:1;transform:none}}
.pin::before{content:"";position:absolute;inset:5%;border-radius:50%;background:rgba(0,0,0,.6);filter:blur(24px);transform:translateY(4%)}
.plate{position:relative;display:block;width:100%;height:100%;overflow:visible;animation:pspin 34s linear infinite;will-change:transform}
@keyframes pspin{to{transform:rotate(360deg)}}
@media (hover:hover){.pwrap:hover .plate{animation-play-state:paused}}
.shine{position:absolute;inset:0;border-radius:50%;pointer-events:none;background:radial-gradient(circle at 30% 24%,rgba(255,255,255,.3),rgba(255,255,255,0) 42%),radial-gradient(circle at 72% 84%,rgba(60,20,0,.28),rgba(60,20,0,0) 55%)}
.mini{cursor:pointer;outline:none}
.mini .hit{stroke:none}
.mini:focus-visible .hit{stroke:var(--rose);stroke-width:2}
.halo{opacity:0}
.mini.glint .halo{animation:halo 1.7s ease-in-out infinite}
@keyframes halo{50%{opacity:.95}}
.spk{position:fixed;z-index:6;width:8px;height:8px;margin:0;border-radius:50%;background:radial-gradient(circle,#fff7c2,#ffb627 60%,rgba(255,182,39,0) 72%);box-shadow:0 0 8px 2px rgba(255,180,50,.75);pointer-events:none}
/* the letter flies out of the thali, then the usual tap-to-open flow takes over */
.letter.fly .env{animation:none;opacity:1}
.letter.fly .env-to{transition:opacity .6s}
.letter.fly:not(.landed) .env-to{opacity:0}
.letter.fly .tap{transition:opacity .6s}
.letter.fly:not(.landed) .tap{opacity:0;animation:none}
@media (prefers-reduced-motion:reduce){.plate,.pin,.mini.glint .halo{animation:none}.find{animation-duration:.01s;animation-delay:0s}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="rangoli" id="rangoli" aria-hidden="true"></div>
<canvas id="c2"></canvas>
<div id="toast" role="status"></div>
<button id="snd" class="snd alt" type="button" data-tip="Mute music" aria-label="Music on or off" aria-pressed="true">
  <svg class="son" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>
  <svg class="soff" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M22 9l-6 6M16 9l6 6"/></svg>
</button>
<section class="start" id="start">
  <h2>Make a Diwali wish</h2>
  <p>Pick who it's for, then add their name.</p>
  <div class="cats" id="cats" role="radiogroup" aria-label="Who is this wish for?"></div>
  <div class="wbox">
    <textarea id="wtext" rows="4" maxlength="280" aria-label="Wish message. You can edit it."></textarea>
    <div class="wtools"><span id="wcount"></span><button type="button" id="wreset" class="hide">Reset to preset</button></div>
  </div>
  <form id="form">
    <input id="name" type="text" maxlength="24" placeholder="Friend's name" aria-label="Friend's name" autocomplete="off" required>
    <button type="submit">Create wish</button>
  </form>
</section>
<section class="letter hide" id="letter" aria-label="A Diwali letter. Tap to open">
  <div class="zoomer"><div class="float">
    <div class="env" id="env" role="button" tabindex="0" aria-label="Open the letter">
      <div class="env-back"></div>
      <div class="paper"><div class="paper-in"><span class="p-om">ॐ</span><b>Happy Diwali</b><i id="pTo"></i></div></div>
      <div class="env-front"></div>
      <div class="flap"></div>
      <div class="seal">ॐ</div>
      <div class="env-to" id="envTo"></div>
    </div>
  </div></div>
  <p class="tap">Tap to open</p>
</section>
<section class="thali hide" id="thali" aria-label="A gold thali of Diwali sweets with a small letter hidden among them">
  <p class="find" id="find">Find and click the letter in the thali</p>
  <div class="pwrap" id="pwrap"><div class="pin" id="pin">
    <svg class="plate" id="plate" viewBox="0 0 600 600" role="group" aria-label="Gold thali of Diwali sweets"></svg>
    <div class="shine"></div>
  </div></div>
</section>
<div class="hint hide" id="hint"><button id="finale" type="button" aria-label="Grand finale"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5v4M12 17.5v4M2.5 12h4M17.5 12h4M5.3 5.3l2.8 2.8M15.9 15.9l2.8 2.8M18.7 5.3l-2.8 2.8M8.1 15.9l-2.8 2.8"/><circle cx="12" cy="12" r="1.6"/></svg>Grand finale</button><span>Tap anywhere for fireworks</span></div>
<main id="wish" class="hide">
  <div class="head"><div id="banner">ॐ लक्ष्मी नम:</div><h1 aria-label="Happy Diwali" id="title"></h1></div>
  <div class="stage" id="stage"><div class="diya" aria-hidden="true"><div class="flame"></div><div class="bowl"></div></div></div>
  <p class="to" id="to"></p>
  <p class="msg" id="msg">May your days glow with light, laughter and sweets, and may every corner of your year be bright.</p>
</main>
<div class="ui hide" id="ui">
  <button id="share" type="button" class="alt" data-tip="Copy share link" aria-label="Copy share link"><svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 10.6l6.8-4.2M8.6 13.4l6.8 4.2"/></svg></button>
  <button id="again" type="button" class="alt" data-tip="New wish" aria-label="New wish"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
</div>
<script>
(function(){
  var $=function(i){return document.getElementById(i)};
  var startEl=$('start'),wishEl=$('wish'),uiEl=$('ui'),hintEl=$('hint'),letterEl=$('letter'),envEl=$('env'),toEl=$('to'),titleEl=$('title'),toast=$('toast'),banner=$('banner');
  // Your hosted site. Share links look like HOSTED_ROOT + friend's name (e.g. .../Just-Html/Rahul)
  var HOSTED_ROOT='https://taiyoyozakura.github.io/Just-Html/';
  var ROOT_PATH='/Just-Html/';
  // Reads the friend's name from the address path when this page is served as 404.html
  function pathLink(){var p=location.pathname;if(p.indexOf(ROOT_PATH)!==0)return null;
    var parts=p.slice(ROOT_PATH.length).replace(/\/+$/,'').split('/');

    var EXT=[['mp3','audio/mpeg'],['m4a','audio/mp4'],['ogg','audio/ogg'],['wav','audio/wav'],['aac','audio/aac'],['opus','audio/ogg; codecs=opus'],['flac','audio/flac'],['weba','audio/webm'],['webm','audio/webm'],['oga','audio/ogg'],['mp4','audio/mp4']];
    var btn=$('snd'),muted=false,started=false,fade=null,VOL=.6,failCount=0;
    try{muted=localStorage.getItem('diwaliMuted')==='1'}catch(e){}

    function makeAudio(name){
      var au=document.createElement('audio');au.loop=true;au.preload='auto';au.setAttribute('playsinline','');au.volume=0;
      EXT.forEach(function(x,i){var src=document.createElement('source');src.src=base+name+'.'+x[0];src.type=x[1];au.appendChild(src);
        if(i===EXT.length-1)src.addEventListener('error',function(){if(++failCount>=2)btn.classList.add('hide')})});
      try{au.load()}catch(e){}
      return au;
    }
    var diwaliAu=makeAudio('diwali_bgm'),blastAu=makeAudio('blast_bgm');
    var activeAu=diwaliAu,activeName='diwali';

    function icon(){btn.classList.toggle('off',muted);btn.setAttribute('aria-pressed',muted?'false':'true');btn.setAttribute('data-tip',muted?'Play music':'Mute music')}
    function fadeTo(au,v,ms,done){clearInterval(fade);var from=au.volume,t0=performance.now();
      fade=setInterval(function(){var k=Math.min(1,(performance.now()-t0)/ms);try{au.volume=Math.max(0,Math.min(1,from+(v-from)*k))}catch(e){}
        if(k>=1){clearInterval(fade);if(done)done()}},40)}
    function tryPlay(au){var p;try{p=au.play()}catch(e){}
      if(p&&p.then)p.then(function(){started=true;fadeTo(au,VOL,2000)},function(){});
      else if(p!==undefined||au.paused===false){started=true;fadeTo(au,VOL,2000)}}

    // switchBgm('blast') on finale start, switchBgm('diwali') on finale end or anywhere else
    window.switchBgm=function(track){
      var want=(track==='blast')?'blast':'diwali';
      if(activeName===want){if(!muted&&activeAu.paused&&started)try{activeAu.play()}catch(e){}return;}
      var old=activeAu,newAu=(want==='blast')?blastAu:diwaliAu;
      fadeTo(old,0,500,function(){old.pause();try{old.currentTime=0}catch(e){}});
      activeName=want;activeAu=newAu;
      if(!muted){activeAu.volume=0;tryPlay(activeAu)}
    };

    function gesture(){
      if(!muted&&activeAu.paused)tryPlay(activeAu);
    }
    addEventListener('pointerdown',gesture);addEventListener('keydown',gesture);window.diwaliBgm=gesture;
    btn.addEventListener('click',function(){
      muted=!muted;try{localStorage.setItem('diwaliMuted',muted?'1':'0')}catch(e){}icon();
      if(muted)fadeTo(activeAu,0,350,function(){activeAu.pause()});
      else{activeAu.volume=0;tryPlay(activeAu)}});
    document.addEventListener('visibilitychange',function(){if(document.hidden)activeAu.pause();else if(started&&!muted)try{activeAu.play()}catch(e){}});
    icon();
  })();

  route();
  if(mode==='start')setTimeout(function(){$('name').focus()},300);
})();
</script>
